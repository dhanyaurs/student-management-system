<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Add Student</h2>

    <div class="form-container">
        <form method="POST" action="{{url_for('add_studentt')}}">
            Student ID:
            <input type="number" name="student_id" required><br><br>

            Name:
            <input type="text" name="student_name" required><br><br>

            Date of Birth:
            <input type="date" name="date_of_birth" required><br><br>

            Gender:
            <input type="text" name="gender" required><br><br>

            Email:
            <input type="email" name="email" required><br><br>

            Phone Number:
            <input type="text" name="phone_number" required><br><br>

            <input type="submit" value="Add Student">
            <a href="{{url_for('home')}}" class="back-link">Back to home</a>
        </form>
    </div>

    {% if stu_details %}
        <p class="success-msg">{{ stu_details }}</p>
    {% endif %}
</body>

</html>
