<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students for a Course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>View Students for a Course</h2>

    <div class="form-container">
        <form method="POST">
            <label>Enter Course ID</label>
            <input type="text" name="course_id" required>
            <button type="submit">Search</button>
        </form>
    </div>

    {% if students %}
    <div class="table-container">
        <table>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
            </tr>

            {% for s in students %}
            <tr>
                <td>{{ s['student_id'] }}</td>
                <td>{{ s['student_name'] }}</td>
                <td>{{ s['email'] }}</td>
                <td>{{ s['phone_number'] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
    {% endif %}

    <a href="/enroll" class="back-link">Back</a>
</body>
</html>
