<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll Student into Course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Enroll Student into Course</h2>

        <div class="form-container">
            <form method="POST">
                <label for="student_id">Select Student:</label>
                <select name="student_id" id="student_id" required>
                    <option value="" disabled selected>-- Choose a Student --</option>
                    {% for student in students %}
                        <option value="{{ student['student_id'] }}">
                            ID: {{ student['student_id'] }} - {{ student['student_name'] }}
                        </option>
                    {% endfor %}
                </select>

                <label for="course_id">Select Course:</label>
                <select name="course_id" id="course_id" required>
                    <option value="" disabled selected>-- Choose a Course --</option>
                    {% for course in courses %}
                        <option value="{{ course['course_id'] }}">
                            ID: {{ course['course_id'] }} - {{ course['course_name'] }}
                        </option>
                    {% endfor %}
                </select>

                <button type="submit" class="btn">Enroll Student</button>
            </form>
        </div>

        <br>
        <a href="/enroll" class="btn-back">Back to Enroll Hub</a>
    </div>
</body>
</html>
